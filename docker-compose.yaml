version: "8.9"

volumes:
  vol-mBanking:

services:
  mBanking-postgres:
    image: "postgres:16.14-trixie"
    container_name: "mBanking-postgres"

    ports:
      - "7777:5432"
    restart: always

    environment:
      POSTGRES_USER: mBanking
      POSTGRES_PASSWORD: mBankingP@ssword
      POSTGRES_DB: DB_mBanking

    volumes:
      - "vol-mBanking:/var/lib/postgresql/data"
